version: "2"

linters:
  default: standard
  enable:
    - exhaustive
  settings:
    exhaustive:
      # A switch on operationType must name every value. A default branch does not count.
      default-signifies-exhaustive: false
  exclusions:
    generated: lax

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
