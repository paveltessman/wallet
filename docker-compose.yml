# The Makefile runs Compose with --env-file config.env, so ${HTTP_PORT} below reads config.env.

services:
  db:
    image: postgres:18-alpine
    # The postgres image reads POSTGRES_USER, POSTGRES_PASSWORD and POSTGRES_DB.
    env_file: config.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: wallet:dev
    build: .
    pull_policy: build
    env_file: config.env
    command: ["migrate", "up"]
    depends_on:
      db:
        condition: service_healthy

  app:
    image: wallet:dev
    build: .
    pull_policy: build
    env_file: config.env
    ports:
      - "${HTTP_PORT:?run Compose with --env-file config.env}:${HTTP_PORT}"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
