default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  # The local hooks call make targets. They use the tool versions from go.mod.
  - repo: local
    hooks:
      - id: golangci-lint-fmt
        name: golangci-lint fmt
        entry: make fmt
        language: system
        types: [go]
        pass_filenames: false
      - id: go-mod-tidy
        name: go mod tidy
        entry: make tidy
        language: system
        files: (\.go|^go\.mod|^go\.sum)$
        pass_filenames: false
      - id: make-check
        name: make check
        entry: make check
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
